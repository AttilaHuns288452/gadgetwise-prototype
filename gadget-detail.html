<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gadget Detail — GadgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main">
    <div class="container">
      <div id="detailStage"><!-- rendered by detail.js --></div>

      <section class="section" style="padding-bottom:24px">
        <div class="row-between" style="margin-bottom:20px">
          <h2>Similar in this category</h2>
          <a class="small" id="similarLink" href="gadgets.html">See all in category</a>
        </div>
        <div class="grid-3" id="similarGrid"></div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/detail.js"></script>
  <script>
    GWApp.initShell({});
    GWDetail.init();
    // Point the "see all" link at the right category once known
    document.addEventListener("DOMContentLoaded", () => {
      const id = new URLSearchParams(location.search).get("id");
      const g = id && GW.getGadget(id);
      if (g) document.getElementById("similarLink").href = "category.html?cat=" + g.category;
    });
  </script>
</body>
</html>
