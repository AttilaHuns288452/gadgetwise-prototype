<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gadget Detail — GadgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect x=%271.5%27 y=%271.5%27 width=%2725%27 height=%2725%27 rx=%276%27 fill=%27%231D5BA4%27/%3E%3Cpath d=%27M14 6.5 7.5 10v8L14 21.5 20.5 18v-8L14 6.5Z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
</head>
<body>
  <main id="main">
    <div class="container">
      <div id="detailStage"><!-- rendered by detail.js --></div>

      <section class="section" style="padding-bottom:24px">
        <div class="row-between" style="margin-bottom:20px">
          <h2 id="similar-heading">Similar in this category</h2>
          <a class="small" id="similarLink" href="gadgets.html">See all in category</a>
        </div>
        <div class="grid-3" id="similarGrid" aria-labelledby="similar-heading"></div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/admin-store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/detail.js"></script>
  <script>
    GWApp.initShell({});
    GWDetail.init();
    // Point the "see all" link at the right category once known
    document.addEventListener("DOMContentLoaded", () => {
      const id = new URLSearchParams(location.search).get("id");
      const g = id && GW.getGadget(id);
      if (g) document.getElementById("similarLink").href = "category.html?cat=" + g.category;
    });
  </script>
</body>
</html>
