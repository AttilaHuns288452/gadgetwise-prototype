<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — GadgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect x=%271.5%27 y=%271.5%27 width=%2725%27 height=%2725%27 rx=%276%27 fill=%27%231D5BA4%27/%3E%3Cpath d=%27M14 6.5 7.5 10v8L14 21.5 20.5 18v-8L14 6.5Z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
</head>
<body>
  <main id="main">
    <div class="container">
      <div class="auth-wrap">
        <div class="auth-card">
          <div class="center" style="margin-bottom:22px">
            <a class="logo" href="index.html" style="justify-content:center; font-size:1.35rem">
              <svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true">
                <rect x="1.5" y="1.5" width="25" height="25" rx="6" fill="#1D5BA4"/>
                <path d="M14 6.5 7.5 10v8L14 21.5 20.5 18v-8L14 6.5Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M14 10v8M10.7 8.9v10.2M17.3 8.9v10.2" stroke="#D9A441" stroke-width="1.4"/>
              </svg>
              Gadget<span class="logo-wise">Wise</span>
            </a>
            <p class="muted small" style="margin-top:6px">Welcome back — your wishlist missed you.</p>
          </div>

          <div class="panel">
            <form id="loginForm">
              <div class="field">
                <label for="loginEmail">School or personal email</label>
                <input type="email" id="loginEmail" placeholder="you@student.edu.ph" required>
              </div>
              <div class="field">
                <label for="loginPass">Password</label>
                <input type="password" id="loginPass" placeholder="••••••••" required>
              </div>
              <div class="row-between" style="margin-bottom:16px">
                <label class="check" style="margin:0"><input type="checkbox" checked> Remember me</label>
                <a class="small" href="#" onclick="GWApp.toast('Password reset is simulated in this prototype','info'); return false;">Forgot password?</a>
              </div>
              <button class="btn btn-block btn-lg" type="submit">Log in</button>
            </form>
            <div class="demo-note">Prototype: no real authentication. Any email and password signs in the demo account (Andrea V.).</div>
          </div>

          <p class="auth-foot">New to GadgetWise? <a href="register.html">Create an account</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/admin-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    GWApp.initShell({});
    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true; btn.textContent = "Signing in…";
      setTimeout(() => { location.href = "profile.html"; }, 600);
    });
  </script>
</body>
</html>
