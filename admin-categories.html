<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — GadgetWise Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-admin-page="categories">
  <div class="admin-shell">
    <div class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Categories</h1>
          <p class="small muted" style="margin:2px 0 0">The six gadget families used for browsing, filtering, and recommendation pools.</p>
        </div>
        <button class="btn btn-sm" id="addCatBtn">+ Add category</button>
      </div>
      <div class="grid-2" id="catGrid"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    GWAdmin.init();
    document.getElementById("addCatBtn").addEventListener("click", () =>
      GWApp.toast("Category creation is simulated in this prototype", "info"));
  </script>
</body>
</html>
