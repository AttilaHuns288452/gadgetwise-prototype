<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — GadgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
</head>
<body>
  <main id="main">
    <div class="container">
      <div class="auth-wrap">
        <div class="auth-card" style="width:min(480px,100%)">
          <div class="center" style="margin-bottom:22px">
            <a class="logo" href="index.html" style="justify-content:center; font-size:1.35rem">
              <svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true">
                <rect x="1.5" y="1.5" width="25" height="25" rx="6" fill="#5b45e6"/>
                <path d="M14 6.5 7.5 10v8L14 21.5 20.5 18v-8L14 6.5Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M14 10v8M10.7 8.9v10.2M17.3 8.9v10.2" stroke="#f4a340" stroke-width="1.4"/>
              </svg>
              Gadget<span class="logo-wise">Wise</span>
            </a>
            <p class="muted small" style="margin-top:6px">Free for students. Your data stays yours.</p>
          </div>

          <div class="panel">
            <form id="regForm">
              <div class="form-grid-2">
                <div class="field">
                  <label for="regFirst">First name</label>
                  <input type="text" id="regFirst" placeholder="Juan" required>
                </div>
                <div class="field">
                  <label for="regLast">Last name</label>
                  <input type="text" id="regLast" placeholder="Dela Cruz" required>
                </div>
              </div>
              <div class="field">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="you@student.edu.ph" required>
              </div>
              <div class="form-grid-2">
                <div class="field">
                  <label for="regPass">Password</label>
                  <input type="password" id="regPass" placeholder="8+ characters" minlength="8" required>
                </div>
                <div class="field">
                  <label for="regPass2">Confirm password</label>
                  <input type="password" id="regPass2" placeholder="Same password" required>
                </div>
              </div>
              <div class="field">
                <label for="regCourse">Course <span class="hint">(used to tune recommendations)</span></label>
                <select id="regCourse">
                  <option>Engineering / CS / IT</option>
                  <option>Business / Accountancy</option>
                  <option>Education</option>
                  <option>Health Sciences</option>
                  <option>Arts &amp; Design</option>
                  <option>Other</option>
                </select>
              </div>
              <label class="check"><input type="checkbox" required> I agree to the Terms and the community review guidelines.</label>
              <button class="btn btn-block btn-lg" type="submit">Create account</button>
            </form>
            <div class="demo-note">Prototype: registration is simulated and creates no real account.</div>
          </div>

          <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    GWApp.initShell({});
    document.getElementById("regForm").addEventListener("submit", e => {
      e.preventDefault();
      const p1 = document.getElementById("regPass").value, p2 = document.getElementById("regPass2").value;
      if (p1 !== p2) { GWApp.toast("Passwords don't match", "alert"); return; }
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true; btn.textContent = "Creating account…";
      setTimeout(() => { location.href = "login.html"; }, 700);
    });
  </script>
</body>
</html>
