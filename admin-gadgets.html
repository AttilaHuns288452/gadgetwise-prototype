<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gadgets — GadgetWise Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect x=%271.5%27 y=%271.5%27 width=%2725%27 height=%2725%27 rx=%276%27 fill=%27%231D5BA4%27/%3E%3Cpath d=%27M14 6.5 7.5 10v8L14 21.5 20.5 18v-8L14 6.5Z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
</head>
<body data-admin-page="gadgets">
  <div class="admin-shell">
    <div class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Gadgets</h1>
          <p class="small muted" style="margin:2px 0 0">Catalog records the recommendation engine and comparison tool rely on.</p>
        </div>
        <a class="btn btn-sm" href="admin-gadget-form.html">+ Add gadget</a>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="adminGadgetSearch" placeholder="Search brand or model…" aria-label="Search gadgets">
        </div>
        <select id="adminCatFilter" aria-label="Filter by category">
          <option value="">All categories</option>
          <option value="smartphones">Smartphones</option>
          <option value="laptops">Laptops</option>
          <option value="tablets">Tablets</option>
          <option value="headphones">Headphones</option>
          <option value="powerbanks">Power Banks</option>
          <option value="smartwatches">Smartwatches</option>
        </select>
        <select id="adminStatusFilter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th style="width:56px"></th>
              <th>GADGET</th>
              <th>CATEGORY</th>
              <th>PRICE</th>
              <th>RATING</th>
              <th>STATUS</th>
              <th style="text-align:right">ACTIONS</th>
            </tr>
          </thead>
          <tbody id="gadgetRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    GWAdmin.init();
  </script>
</body>
</html>
