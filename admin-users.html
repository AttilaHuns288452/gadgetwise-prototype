<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — GadgetWise Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-admin-page="users">
  <div class="admin-shell">
    <div class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Users</h1>
          <p class="small muted" style="margin:2px 0 0">Registered student accounts. Suspension blocks posting reviews and issues, not browsing.</p>
        </div>
        <div class="search-box" style="max-width:280px">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" placeholder="Search users…" aria-label="Search users" oninput="GWApp.toast('User search is decorative in this prototype','info')">
        </div>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>USER</th>
              <th>REGISTERED</th>
              <th>STATUS</th>
              <th>REVIEWS</th>
              <th style="text-align:right">ACTIONS</th>
            </tr>
          </thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>GWAdmin.init();</script>
</body>
</html>
