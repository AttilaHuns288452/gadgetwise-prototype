<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — GadgetWise Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
</head>
<body data-admin-page="dashboard">
  <div class="admin-shell">
    <div class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Dashboard</h1>
          <p class="small muted" style="margin:2px 0 0">Live overview of the catalog and moderation queues.</p>
        </div>
        <div class="row" style="gap:8px">
          <a class="btn btn-outline btn-sm" href="admin-reviews.html">Moderation queue</a>
          <a class="btn btn-sm" href="admin-gadget-form.html">+ Add gadget</a>
        </div>
      </div>

      <div class="stat-grid" id="statGrid"></div>

      <div class="grid-2" id="dashTrends" style="align-items:start"></div>

      <div class="grid-2" style="margin-top:24px">
        <div class="panel">
          <h4 style="margin-bottom:8px">Popular categories</h4>
          <p class="small muted" style="margin:0">Smartphones and laptops draw 65% of catalog views — keep their specs and issues freshest.</p>
        </div>
        <div class="panel">
          <h4 style="margin-bottom:8px">Data status</h4>
          <p class="small muted" style="margin:0">Figures come from the catalog dataset plus admin edits stored in this browser.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin-store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/admin.js"></script>
  <script>GWAdmin.init();</script>
</body>
</html>
