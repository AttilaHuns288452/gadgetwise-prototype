<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — GadgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect x=%271.5%27 y=%271.5%27 width=%2725%27 height=%2725%27 rx=%276%27 fill=%27%231D5BA4%27/%3E%3Cpath d=%27M14 6.5 7.5 10v8L14 21.5 20.5 18v-8L14 6.5Z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
  <style>
    body { background: var(--ink); }
    .admin-auth { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .admin-auth .card { width: min(400px, 100%); background: var(--surface); border-radius: var(--r-lg); padding: 36px 34px; box-shadow: 0 24px 64px rgba(0,0,0,.4); }
    .admin-auth .badge-strip { display: inline-flex; align-items: center; gap: 8px; font-size: .72rem; font-weight: 700; letter-spacing: .1em; color: var(--accent-strong); margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="admin-auth">
    <div class="card">
      <div class="logo" style="font-size:1.3rem">
        <svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true">
          <rect x="1.5" y="1.5" width="25" height="25" rx="6" fill="#1D5BA4"/>
          <path d="M14 6.5 7.5 10v8L14 21.5 20.5 18v-8L14 6.5Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        Gadget<span class="logo-wise">Wise</span>
      </div>
      <div class="badge-strip">■ STAFF CONSOLE</div>
      <h1 style="font-size:1.5rem; margin-bottom:4px">Admin sign-in</h1>
      <p class="muted small" style="margin-bottom:22px">Catalog, moderation, and reporting tools. Separate from student accounts.</p>

      <form id="adminForm">
        <div class="field">
          <label for="adminUser">Staff username</label>
          <input type="text" id="adminUser" placeholder="admin" required>
        </div>
        <div class="field">
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" placeholder="••••••••" required>
        </div>
        <button class="btn btn-block btn-lg" type="submit">Sign in to console</button>
      </form>
      <div class="demo-note">Prototype: any credentials work. In production this gate sits in front of role-checked routes only.</div>
      <p class="auth-foot"><a href="index.html">← Back to GadgetWise</a></p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // No public shell on the admin gate
    document.getElementById("adminForm").addEventListener("submit", e => {
      e.preventDefault();
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true; btn.textContent = "Verifying…";
      setTimeout(() => { location.href = "admin-dashboard.html"; }, 500);
    });
  </script>
</body>
</html>
