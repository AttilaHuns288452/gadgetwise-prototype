<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — GadgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
</head>
<body>
  <main id="main">
    <div class="container page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span>
        <a href="gadgets.html">Gadgets</a><span class="sep">/</span>
        <span id="crumbCat">Category</span>
      </nav>
      <div class="row" style="gap:16px; margin-top:14px">
        <span id="catIcon" style="width:56px; height:56px; border-radius:10px; border:1px solid var(--line); background:var(--primary-soft); display:inline-flex; align-items:center; justify-content:center; color:var(--primary)"></span>
        <div>
          <h1 id="catName">Category</h1>
          <p class="lede" id="catBlurb"></p>
        </div>
      </div>
    </div>

    <div class="container section-tight">
      <div class="catalog-layout">
        <aside class="filters" aria-label="Filters">
          <div class="panel panel-tight">
            <div class="filter-group">
              <h4>PRICE RANGE (₱)</h4>
              <div class="range-inputs">
                <input type="number" id="minPrice" placeholder="Min" min="0" aria-label="Minimum price">
                <span>–</span>
                <input type="number" id="maxPrice" placeholder="Max" min="0" aria-label="Maximum price">
              </div>
            </div>
            <div class="filter-group">
              <h4>BRAND</h4>
              <div id="brandFilters"></div>
            </div>
            <div class="filter-group" style="border-bottom:0; padding-bottom:0">
              <button class="btn btn-outline btn-sm btn-block" id="clearFilters">Clear all filters</button>
            </div>
          </div>
        </aside>

        <div>
          <div class="row-between" style="margin-bottom:16px">
            <div class="search-box" style="flex:1; max-width:420px">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="catalogSearch" placeholder="Search in this category…" aria-label="Search gadgets">
            </div>
            <div class="sort-row">
              <label class="small muted" for="sortSelect">Sort</label>
              <select id="sortSelect">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="rating">Highest rated</option>
                <option value="monthly">Lowest ₱/month</option>
                <option value="reviews">Most reviewed</option>
              </select>
            </div>
          </div>
          <p class="result-meta" id="resultMeta"></p>
          <div class="catalog-grid" id="catalogGrid"></div>
          <div id="catalogEmpty" class="hidden">
            <div class="panel empty-state">
              <div class="es-title">No gadgets match your filters</div>
              <p class="small">Try clearing a filter.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/cat-icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
  <script>
    GWApp.initShell({ active: "gadgets.html" });
    const catId = new URLSearchParams(location.search).get("cat") || "smartphones";
    const cat = GW.getCategory(catId) || GW.categories[0];
    document.title = `${cat.name} — GadgetWise`;
    document.getElementById("crumbCat").textContent = cat.name;
    document.getElementById("catName").textContent = cat.name;
    document.getElementById("catBlurb").textContent = cat.blurb;
    document.getElementById("catIcon").innerHTML = GWCatIcons[cat.id] || "";
    GWCatalog.init({ category: cat.id });
  </script>
</body>
</html>
