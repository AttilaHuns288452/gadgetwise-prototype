<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — GadgetWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect x=%271.5%27 y=%271.5%27 width=%2725%27 height=%2725%27 rx=%276%27 fill=%27%231D5BA4%27/%3E%3Cpath d=%27M14 6.5 7.5 10v8L14 21.5 20.5 18v-8L14 6.5Z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
</head>
<body>
  <main id="main">
    <div class="container page-head">
      <h1>Wishlist</h1>
      <p class="lede">Gadgets you're considering, saved on this device.</p>
    </div>

    <div class="container section-tight">
      <div id="wishlistBody"></div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    GWApp.initShell({ active: "" });

    const esc = GWApp.esc;

    function render() {
      const body = document.getElementById("wishlistBody");
      const items = [...GWApp.state.wishlist].map(GW.getGadget).filter(Boolean);
      if (!items.length) {
        body.innerHTML = `<div class="panel empty-state">
          ${GWApp.icon("heart")}
          <div class="es-title">Your wishlist is empty</div>
          <p class="small">Tap the heart on any gadget card to keep it here while you decide.</p>
          <a class="btn" href="gadgets.html">Browse gadgets ${GWApp.icon("arrowRight")}</a>
        </div>`;
        return;
      }
      const total = items.reduce((n, g) => n + g.price, 0);
      const monthly = items.reduce((n, g) => n + GW.monthlyCost(g), 0);
      body.innerHTML = `
        <div class="panel panel-tight" style="margin-bottom:18px">
          <div class="row-between" style="flex-wrap:wrap; gap:10px">
            <div>
              <b>${items.length} gadget${items.length === 1 ? "" : "s"} saved</b>
              <div class="small muted">Combined price ${GWApp.money(total)} · combined cost per month ≈ ${GWApp.money(monthly)}/month</div>
            </div>
            <div class="row" style="gap:8px">
              <a class="btn btn-outline btn-sm" href="gadgets.html">Add more</a>
              <a class="btn btn-sm" href="recommendations.html">Get recommendations ${GWApp.icon("arrowRight", "icon-sm")}</a>
            </div>
          </div>
        </div>
        <div class="stack" style="gap:12px">
          ${items.map(g => `
            <div class="list-row">
              <a href="${GWApp.gadgetUrl(g.id)}"><img class="thumb" style="width:84px;height:64px" src="${g.image}" alt=""></a>
              <div style="flex:1; min-width:0">
                <div class="g-brand">${esc(g.brand)} · ${esc(GWApp.catLabel(g.category))}</div>
                <a href="${GWApp.gadgetUrl(g.id)}" class="t-title" style="color:inherit">${esc(g.model)}</a>
                <div class="small muted">${GWApp.ratingLine(g)}</div>
              </div>
              <div style="text-align:right">
                ${GWApp.priceBlock(g, "compact")}
              </div>
              <div class="row" style="gap:8px">
                <label class="cmp-check"><input type="checkbox" data-cmp="${g.id}" ${GWApp.inCompare(g.id) ? "checked" : ""}> Compare</label>
                <button class="icon-btn" data-wl="${g.id}" aria-pressed="true" title="Remove from wishlist" style="border:1px solid var(--line-2)">${GWApp.icon("heart")}</button>
                <a class="btn btn-outline btn-sm" href="${GWApp.gadgetUrl(g.id)}">Details</a>
              </div>
            </div>`).join("")}
        </div>`;
    }
    render();
    document.addEventListener("gw:wishlist-change", render);
    document.addEventListener("gw:compare-change", render);
  </script>
</body>
</html>
